
version: '2.1'

orbs:
  python: circleci/python@2.1.1

workflows:
  main:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/

jobs:
  build:
    docker:
      - image: cimg/python:3.13
    executor: python/default
    steps:
      - checkout:
          method: full
      - run:
          name: Install library dependencies
          command: |
            pip install --upgrade pip
            pip install wheel
            pip install setuptools
            pip install codeallybasic==1.30.0
            pip install PyGithub==2.8.1
            pip install todoist_api_python==3.2.1
            pip install html-testRunner==1.2.1
            pip install buildlackey==2.0.0
      - run:
            name: run tests
            command: | 
              unittests
